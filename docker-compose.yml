version: '3.8'

services:
  mlflow:
    image: python:3.12-slim
    command: >
      bash -c "pip install mlflow &&
               mlflow server 
               --backend-store-uri sqlite:///mlflow.db
               --default-artifact-root ./mlruns
               --host 0.0.0.0
               --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./mlflow.db:/mlflow.db
    environment:
      - MLFLOW_S3_ENDPOINT_URL

  app:
    build: .
    command: poetry run python main.py --help
    volumes:
      - .:/app
    depends_on:
      - mlflow
    environment:
      - PROJECT_ROOT=/app
      - MLFLOW_TRACKING_URI=http://mlflow:5000

  test:
    build: .
    command: poetry run pytest tests/ -v
    volumes:
      - .:/app
    environment:
      - PROJECT_ROOT=/app
