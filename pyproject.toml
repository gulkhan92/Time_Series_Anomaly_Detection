[tool.poetry]
name = "time-series-anomaly-detection"
version = "0.1.0"
description = "Production-ready KDD99 time series anomaly detection with LSTM Autoencoder"
authors = ["BLACKBOXAI <ai@blackbox.ai>"]
readme = "README.md"
package-mode = true

[tool.poetry.dependencies]
python = "^3.14"
torch = "2.9.1"
pandas = "^2.2.2"
numpy = "^2.0.0"
scikit-learn = "^1.5.0"
pydantic = "^2.8.0"
click = "^8.1.7"
hydra-core = "^1.3.2"
pyyaml = "^6.0.2"
seaborn = "^0.13.2"
matplotlib = "^3.9.2"
mlflow = "^2.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
jupyter = "^1.0.0"
black = "^24.4.2"
isort = "^5.13.2"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
